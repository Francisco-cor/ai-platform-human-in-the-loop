name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: prompt governance lint — Fase 6
        run: python tools/prompt_lint.py
      - run: pytest -q
      - name: dependency scan — Fase 7
        run: |
          pip install pip-audit
          pip-audit --desc || echo "pip-audit found vulnerabilities (non-blocking for demo)"
      - name: eval harness (direct, suite all) — Fase 7 (22 casos)
        run: |
          python -m procurement_platform.evals.runner --mode direct --suite all --output evals/reports/ci_report.json
          cat evals/reports/ci_report.json | python -m json.tool | head -n 120
      - name: eval gate — Fase 7 (bloquea regresión, unsafe>0, duplicate>0)
        run: |
          # gate contra baseline_v2 (22 casos) si existe, sino v1
          if [ -f evals/reports/baseline_v2.json ]; then BASELINE=evals/reports/baseline_v2.json; else BASELINE=evals/reports/baseline_v1.json; fi
          echo "Using baseline $BASELINE"
          python -m procurement_platform.evals.runner --mode direct --suite all --gate --baseline $BASELINE
      - name: llm matrix (provider comparison) — Fase 6
        run: |
          python -m procurement_platform.evals.llm_matrix --providers fake gemini deepseek --output evals/reports/ci_llm_matrix.json
          cat evals/reports/ci_llm_matrix.json | python -m json.tool | head -n 60
      - name: prompt A/B gate — Fase 6
        run: |
          python -m procurement_platform.evals.runner --prompt-a procurement-v1 --prompt-b procurement-v2 --gate-ab --ab-output evals/reports/ci_prompt_ab.json
          cat evals/reports/ci_prompt_ab.json | python -m json.tool | head -n 80
      - name: security adversarial checks — Fase 7
        run: |
          python -m pytest tests/security -v
          python -m pytest tests/integration/test_security_adversarial.py -v
