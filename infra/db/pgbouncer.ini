[databases]
procurement = host=10.0.0.3 port=5432 dbname=procurement auth_user=procurement

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 20
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = select 1
ignore_startup_parameters = extra_float_digits

# TLS to Cloud SQL via Cloud SQL Auth Proxy is recommended; pgbouncer sits between app and proxy
# Procurement API connects via PROCUREMENT_DATABASE_URL=postgresql+psycopg://procurement:pass@pgbouncer:6432/procurement
