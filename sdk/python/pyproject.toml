[project]
name = "procurement-sdk-py"
version = "0.1.0"
description = "Python SDK for Procurement Platform — Fase 8 API Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["httpx>=0.27.0", "pydantic>=2.0.0"]
authors = [{ name = "procurement-platform" }]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["procurement_sdk"]

[project.urls]
Homepage = "https://github.com/procurement-platform"
